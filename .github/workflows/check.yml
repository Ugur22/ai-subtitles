name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # deploy.yml runs these checks before every production deploy.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name under workflow_call, so a deploy's checks
# never cancel (or get cancelled by) the push-triggered checks of the same ref.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make lint-frontend typecheck-frontend test-frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The default torch wheel on Linux bundles CUDA (multiple GB); the tests only need the CPU build.
      - run: pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      # onnxruntime-gpu and insightface are not imported by any test and fail to install on a plain runner.
      - run: |
          grep -viE '^(onnxruntime-gpu|insightface)' backend/requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" pytest==9.1.1 ruff==0.12.0
      - run: make lint-backend test-backend PY=python

  # Mutation controls (tools/ratchets/mutations.json): each critical test must fail when the protection it guards
  # is removed. Its own job so the other checks don't wait for it; skips the installs while the list is empty.
  mutation-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: count
        run: echo "n=$(python3 -c 'import json; print(len(json.load(open("tools/ratchets/mutations.json"))["mutations"]))')" >> "$GITHUB_OUTPUT"
      - if: steps.count.outputs.n != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.count.outputs.n != '0'
        run: pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - if: steps.count.outputs.n != '0'
        run: |
          grep -viE '^(onnxruntime-gpu|insightface)' backend/requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" pytest==9.1.1
      - if: steps.count.outputs.n != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.count.outputs.n != '0'
        run: npm ci
        working-directory: frontend
      - run: make mutation-check PY=python

  # The policy checker and the agent-container scripts are tested here like any code; policy.yml is what
  # enforces them, from main's revision.
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==9.1.1 pyyaml==6.0.2
      - run: python -m pytest -q -p no:cacheprovider tools/policy tools/harness tools/ratchets/test_framework.py
      - run: |
          shellcheck -S warning bin/agent tools/agent-container/init-firewall.sh tools/agent-container/agent-checks.sh \
            tools/agent-container/agent-session tools/agent-container/agent-verify \
            tools/agent-container/git-credential-agent tools/agent-container/gh tools/agent-container/ai-risk scripts/hooks/stop-check.sh
          python -m json.tool tools/agent-container/managed-settings.json >/dev/null

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      # No backend: validate needs only the provider schema, not state or credentials.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
