name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # deploy.yml runs these checks before every production deploy.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name under workflow_call, so a deploy's checks
# never cancel (or get cancelled by) the push-triggered checks of the same ref.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make lint-frontend typecheck-frontend test-frontend

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The default torch wheel on Linux bundles CUDA (multiple GB); the tests only need the CPU build.
      - run: pip install torch==2.7.0 torchaudio==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      # onnxruntime-gpu and insightface are not imported by any test and fail to install on a plain runner.
      - run: |
          grep -viE '^(onnxruntime-gpu|insightface)' backend/requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" pytest==9.1.1
      - run: make lint-backend test-backend PY=python

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      # No backend: validate needs only the provider schema, not state or credentials.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
